# Copy this file to config.yml in the same directory and fill in your own values.
# config.yml is gitignored; never commit a real token.

# Prefix that starts a command, e.g. "?help".
prefix: '?'

tokens:
    # Discord Developer Portal -> your application -> Bot -> Reset Token.
    discord: "YOUR_DISCORD_BOT_TOKEN"

sarcasm-level: 0
humor-level: 0

tarscord-context:
    connection-string: "Host=localhost;Username=root;Password=password;Database=tarscord_db"

messages:
    euro_sign: "€"
