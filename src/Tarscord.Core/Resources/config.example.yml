# Defaults for every key. Put your own values in config.yml beside this file, which is read on top
# of it and is gitignored; never commit a real token.

# Prefix that starts a command, e.g. "?help".
prefix: '?'

tokens:
    # Discord Developer Portal -> your application -> Bot -> Reset Token. Set this in config.yml.
    discord: ""

# Both 0-10, and both settable at runtime with ?sarcasm-level and ?humor-level.
sarcasm-level: 0
humor-level: 0

# The local model the bot talks through. Tarscord works without it: if nothing answers at this
# address, ?dare and replies to a mention fall back to fixed lines.
ollama:
    url: "http://localhost:11434"
    model: "llama3.1"

tarscord-context:
    # Required, no default. Compose stack: Host=localhost;Username=root;Password=password;Database=tarscord_db
    connection-string: ""
